apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-account # For IRSA
      containers:
      - name: backend
        image: docushield-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: USE_AWS
          value: "true"
        - name: S3_BUCKET_NAME
          value: "docushield-docs"
        - name: AWS_REGION
          value: "us-east-1"
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: docushield-secrets
              key: groq-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
